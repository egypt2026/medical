<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دليل مقدمي الخدمة الطبية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#e9f7f6;--bg2:#f6f1ff;--card:rgba(255,255,255,.78);--bd:rgba(20,40,60,.12);--tx:#0f2233;--mut:#5a6f80;--pri:#0ea5a4;--pri2:#6366f1;--acc:#f59e0b;--ok:#16a34a;--bad:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#071a22;--bg2:#150f2e;--card:rgba(255,255,255,.07);--bd:rgba(255,255,255,.14);--tx:#eaf4f8;--mut:#9db3c2;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#071a22;--bg2:#150f2e;--card:rgba(255,255,255,.07);--bd:rgba(255,255,255,.14);--tx:#eaf4f8;--mut:#9db3c2;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:'Cairo',Tahoma,Arial,sans-serif;color:var(--tx);min-height:100vh;background:radial-gradient(900px 500px at 85% -10%,color-mix(in srgb,var(--pri) 30%,transparent),transparent),radial-gradient(800px 500px at 0% 10%,color-mix(in srgb,var(--pri2) 28%,transparent),transparent),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed}
.wrap{max-width:1050px;margin:auto;padding:18px 14px 60px}
header{text-align:center;padding:26px 0 8px}
.logo{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-size:32px;box-shadow:0 10px 30px color-mix(in srgb,var(--pri) 45%,transparent);animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
h1{margin:12px 0 4px;font-size:clamp(24px,5vw,38px);font-weight:800;background:linear-gradient(90deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);margin:0}
.tabs{display:flex;gap:8px;justify-content:center;margin:16px 0}
.tab,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 18px;border-radius:12px;cursor:pointer;backdrop-filter:blur(10px);transition:.2s}
.tab.on,.btn.p{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-color:transparent}
.btn:hover,.tab:hover{transform:translateY(-2px)}
.btn.d{color:var(--bad)}.btn.s{padding:5px 11px;font-size:13px;border-radius:9px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:18px;backdrop-filter:blur(14px);box-shadow:0 12px 40px rgba(0,0,0,.08)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
select,input,textarea{width:100%;font:inherit;color:var(--tx);background:color-mix(in srgb,var(--card) 70%,transparent);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 25%,transparent)}
option{color:#111}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1px solid var(--bd);background:transparent;color:var(--tx);font:inherit;font-size:13px;padding:5px 13px;border-radius:99px;cursor:pointer}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.cnt{margin:18px 4px 8px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;backdrop-filter:blur(12px);animation:in .45s both;transition:.25s;overflow:hidden}
.card:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(0,0,0,.14);border-color:var(--pri)}
.card:before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--pri),var(--pri2))}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.card h3{margin:6px 0 8px;font-size:18px}
.tag{display:inline-block;font-size:12px;padding:3px 10px;border-radius:99px;margin-left:6px;background:color-mix(in srgb,var(--pri) 18%,transparent);color:var(--pri);font-weight:600}
.tag.ty{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc)}.tag.sp{background:color-mix(in srgb,var(--pri2) 18%,transparent);color:var(--pri2)}
.row{display:flex;gap:8px;margin:8px 0;font-size:14px;color:var(--mut);line-height:1.6}
.row b{color:var(--tx);font-weight:600}
.price{margin-top:10px;padding:9px 12px;border-radius:12px;font-size:14px;font-weight:600;background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--acc)}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.acts a,.acts button{flex:1;min-width:90px;text-align:center;text-decoration:none;font:inherit;font-size:14px;border:1px solid var(--bd);background:transparent;color:var(--tx);padding:8px;border-radius:11px;cursor:pointer}
.acts a.call{background:var(--ok);color:#fff;border-color:transparent}
.empty{text-align:center;padding:50px 10px;color:var(--mut);grid-column:1/-1}
.empty div{font-size:50px}
.tw{overflow-x:auto;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
th,td{padding:9px;border-bottom:1px solid var(--bd);text-align:right;vertical-align:top}
th{color:var(--mut);font-weight:600}
dialog{border:1px solid var(--bd);border-radius:20px;background:var(--bg1);color:var(--tx);width:min(560px,94vw);padding:20px;font-family:inherit}
dialog::backdrop{background:rgba(0,0,0,.5);backdrop-filter:blur(4px)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg .w{grid-column:1/-1}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.st{font-size:13px;color:var(--mut)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:12px;z-index:9;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}
@media(max-width:520px){.fg{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo">✚</div><h1>دليل مقدمي الخدمة الطبية</h1><p class="sub">ابحث بالمحافظة والتخصص وتواصل مباشرة</p><p class="sub" id="stat" data-dyn style="font-size:14px;margin-top:4px"></p></header>

<section id="vS">
<div class="panel">
<div class="filters">
<div><label>المحافظة</label><select id="fG" data-dyn></select></div>
<div><label>نوع الخدمة</label><select id="fT" data-dyn></select></div>
<div><label>التخصص</label><select id="fSp" data-dyn></select></div>
<div><label>المنطقة</label><select id="fA" data-dyn></select></div>
<div><label>بحث بالاسم أو العنوان</label><input id="fQ" placeholder="اكتب للبحث..."></div>
</div>
</div>
<div class="cnt" id="cnt" data-dyn></div>
<div class="grid" id="res" data-dyn></div>
<div style="text-align:center;margin-top:18px"><button class="btn p" id="more" hidden>عرض المزيد</button></div>
</section>

</div>


<div class="st" id="src" style="text-align:center;margin-top:30px"></div>
<div class="toast" id="ts"></div>

<script>
/* ====== الإعدادات: ضع هنا رابط الشيت المنشور بصيغة CSV ====== */
var CONFIG={SHEET_CSV_URL:"",EDIT_URL:""};
/* ============================================================ */
var ALL="جميع التخصصات",PS=30,shown=PS,D=[],$=function(i){return document.getElementById(i)};
function nz(s){return String(s||'').replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/\s+/g,' ').toLowerCase().trim()}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toast(m){var t=$('ts');t.textContent=m;t.classList.add('on');setTimeout(function(){t.classList.remove('on')},2200)}
function csv(t){var r=[],row=[],f='',q=false,i=0,c;t=t.replace(/^\uFEFF/,'');for(;i<t.length;i++){c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else if(c=='"')q=true;else if(c==','){row.push(f);f=''}else if(c=='\n'){row.push(f);r.push(row);row=[];f=''}else if(c!='\r')f+=c}row.push(f);r.push(row);return r}
function phones(s){return String(s||'').split(/[\/،,|;\n]/).map(function(p){p=p.trim();if(/^1\d{9}$/.test(p))p='0'+p;return p}).filter(Boolean)}
function fromRows(R){var map={},H=R[0].map(nz),keys=[['g','محافظ'],['t','نوع'],['sp','تخصص'],['a','منطق'],['n','مقدم'],['ad','عنوان'],['ph','هاتف'],['ph','تليفون'],['pr','سعر'],['pr','اسعار'],['deg','درج']];
 keys.forEach(function(k){if(map[k[0]]==null)H.forEach(function(h,i){if(map[k[0]]==null&&h.indexOf(k[1])>-1)map[k[0]]=i})});
 if(map.n==null||map.g==null)throw new Error('cols');
 var out=[];R.slice(1).forEach(function(r,i){var v=function(k){return map[k]==null?'':String(r[map[k]]||'').trim()};if(!v('n'))return;
  out.push({id:'r'+i,g:v('g'),t:v('t'),sp:v('sp')||ALL,a:v('a'),n:v('n'),ad:v('ad'),ph:phones(v('ph')),pr:v('pr'),deg:v('deg')})});return out}
function idx(x){x._s=nz([x.n,x.ad,x.a,x.g,x.sp,x.t,x.deg].join(' '))}
var PRI=['القاهرة','الجيزة','الإسكندرية'];
function F(ex){var g=$('fG').value,t=$('fT').value,s=$('fSp').value,a=$('fA').value,q=nz($('fQ').value);
 return D.filter(function(x){return (ex=='g'||!g||x.g===g)&&(ex=='t'||!t||x.t===t)&&(ex=='a'||!a||x.a===a)&&(ex=='s'||!s||x.sp===s||x.sp===ALL)&&(!q||x._s.indexOf(q)>-1)})}
function cnt(r,k){var m={};r.forEach(function(x){if(x[k])m[x[k]]=(m[x[k]]||0)+1});return m}
function fill(id,m,first,skip,pri){var s=$(id),v=s.value,ks=Object.keys(m).filter(function(k){return k!==skip});
 ks.sort(function(a,b){var pa=pri?PRI.indexOf(a):-1,pb=pri?PRI.indexOf(b):-1;if(pa>-1||pb>-1)return (pa<0?99:pa)-(pb<0?99:pb);return a.localeCompare(b,'ar')});
 s.innerHTML='<option value="">'+first+'</option>'+ks.map(function(k){return '<option value="'+esc(k)+'">'+esc(k)+' ('+m[k]+')</option>'}).join('');s.value=ks.indexOf(v)>-1?v:''}
function render(){fill('fG',cnt(F('g'),'g'),'كل المحافظات','',1);fill('fT',cnt(F('t'),'t'),'كل الأنواع');fill('fSp',cnt(F('s'),'sp'),'كل التخصصات',ALL);fill('fA',cnt(F('a'),'a'),'كل المناطق');
 var r=F();$('stat').textContent=D.length+' مقدم خدمة في '+Object.keys(cnt(D,'g')).length+' محافظة';
 $('cnt').textContent='تم العثور على '+r.length+' نتيجة';
 $('res').innerHTML=r.length?r.slice(0,shown).map(function(x,i){var ph=x.ph||[],spc=x.sp===ALL?'كل التخصصات':x.sp;
  return '<article class="card" style="animation-delay:'+Math.min(i%PS*40,400)+'ms"><span class="tag">📍 '+esc(x.g)+' - '+esc(x.a)+'</span>'+(x.t?'<span class="tag ty">'+esc(x.t)+'</span>':'')+'<span class="tag sp">'+esc(spc)+'</span><h3>'+esc(x.n)+'</h3>'
  +(x.deg?'<div class="row">🎓<b>'+esc(x.deg)+'</b></div>':'')
  +'<div class="row">🏠<b>'+esc(x.ad||'—')+'</b></div>'
  +'<div class="row">📞<b dir="ltr">'+(ph.map(function(p){return '<a href="tel:'+esc(p.replace(/\s/g,''))+'" style="color:inherit">'+esc(p)+'</a>'}).join(' &nbsp;|&nbsp; ')||'—')+'</b></div>'
  +(x.pr?'<div class="price">💰 '+esc(x.pr)+'</div>':'')
  +'<div class="acts">'+(ph[0]?'<a class="call" href="tel:'+esc(ph[0].replace(/\s/g,''))+'">اتصال</a>':'')
  +'<a target="_blank" rel="noopener" href="https://www.google.com/maps/search/'+encodeURIComponent(x.n+' '+x.a+' '+x.g)+'">الخريطة</a>'
  +'<button data-c="'+i+'">نسخ</button></div></article>'}).join(''):'<div class="empty"><div>🩺</div>لا توجد نتائج مطابقة، جرّب تغيير الفلاتر</div>';
 $('more').hidden=r.length<=shown;$('more').textContent='عرض المزيد ('+(r.length-shown)+' متبقية)'}
document.addEventListener('click',function(e){var t=e.target.closest('button[data-c]');if(!t)return;var x=F()[+t.dataset.c];if(!x)return;
 var s=x.n+'\n'+x.g+' - '+x.a+' - '+x.ad+'\n'+(x.ph||[]).join(' / ');
 (navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(function(){toast('تم النسخ ✓')},function(){toast('تعذر النسخ')})});
['fG','fT','fSp','fA'].forEach(function(i){$(i).addEventListener('change',function(){shown=PS;render()})});
$('fQ').addEventListener('input',function(){shown=PS;render()});$('more').onclick=function(){shown+=PS;render()};
function use(rows,label){D=rows;D.forEach(idx);$('src').textContent=label+(CONFIG.EDIT_URL?'':'');if(CONFIG.EDIT_URL)$('src').innerHTML=esc(label)+' · <a href="'+esc(CONFIG.EDIT_URL)+'" target="_blank" rel="noopener" style="color:var(--pri)">تعديل البيانات</a>';render()}
(async function(){
 var snap=[];try{snap=JSON.parse($('data').textContent)}catch(e){}
 if(CONFIG.SHEET_CSV_URL){
  try{var res=await fetch(CONFIG.SHEET_CSV_URL,{cache:'no-store'});if(!res.ok)throw 0;var rows=fromRows(csv(await res.text()));if(!rows.length)throw 0;
   try{localStorage.setItem('mdir',JSON.stringify(rows))}catch(e){}
   return use(rows,'البيانات من Google Sheet • '+new Date().toLocaleDateString('ar-EG'))}catch(e){}
  try{var c=JSON.parse(localStorage.getItem('mdir')||'null');if(c&&c.length)return use(c,'نسخة محفوظة (تعذر الاتصال بالشيت)')}catch(e){}
 }
 use(snap,CONFIG.SHEET_CSV_URL?'نسخة مدمجة (تعذر الاتصال بالشيت)':'نسخة مدمجة')})();
</script>
